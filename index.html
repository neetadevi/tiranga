<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tiranga Pay - Earn Money Online</title>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script type="text/javascript">
      // Decode redirected path from 404.html for GitHub Pages SPA
      (function() {
        var query = window.location.search;
        if (query.indexOf('?p=') !== -1) {
          var p = decodeURIComponent(query.slice(3).split('&')[0]);
          if (p.toLowerCase().indexOf('admin') !== -1) {
            window.history.replaceState(null, null, window.location.pathname.replace(/\/$/, '') + '/admin');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
