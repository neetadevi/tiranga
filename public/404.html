<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tiranga Pay</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages
      // Encodes path into query string so index.html loads it seamlessly
      var segmentCount = 1;
      var l = window.location;
      var pathSegments = l.pathname.slice(1).split('/');
      var repo = pathSegments[0] ? '/' + pathSegments[0] : '';
      
      // If path has /admin, redirect to /tiranga/?admin or with hash
      var subPath = l.pathname.slice(repo.length);
      l.replace(
        l.protocol + '//' + l.host + repo + '/?p=' + encodeURIComponent(subPath + l.search) + l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Tiranga Pay...</p>
  </body>
</html>
